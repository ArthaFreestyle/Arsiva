version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"   # (Opsional) Buka port 443 nanti kalau sudah pakai HTTPS/SSL
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # nginx parses `ssl_certificate` once at startup and keeps the cert in
    # memory -- it does NOT watch the file. Without this, certbot could renew
    # successfully on disk and nginx would keep serving the expiring cert until
    # a human restarted the container (see issue #44). certbot cannot signal a
    # sibling container without the Docker socket, so nginx reloads itself on a
    # timer instead; 6h is far inside the ~30-day renewal window.
    # `exec` keeps nginx as PID 1 so the image's STOPSIGNAL (SIGQUIT) still
    # reaches it and shutdown stays graceful.
    command: >-
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"
    depends_on:
      - api-server
    networks:
      - app-network
    restart: unless-stopped

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: arsiva-backend:latest
    # Lets the container reach services on the VPS host (e.g. the Postfix SMTP
    # relay on host :25). Inside a container `localhost` is the container itself,
    # so the mailer must target `host.docker.internal` instead. `host-gateway`
    # resolves that name to the host's Docker bridge gateway IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ~/actions-runner/_work/Arsiva/Arsiva/arsiva_configs/config.json:/config.json:ro
      - ~/actions-runner/_work/Arsiva/Arsiva/uploads:/app/uploads
      - ~/actions-runner/_work/Arsiva/Arsiva/logs:/app/logs
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_container
    environment:
      POSTGRES_USER: admin_pn
      POSTGRES_PASSWORD: 2o26jOdmt9eK8CacdPwc
      POSTGRES_DB: production_db
      TZ: Asia/Jakarta
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_pn -d production_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      # The renew loop fires immediately on start and answers the HTTP-01
      # challenge through nginx's /.well-known/acme-challenge/ handler, so nginx
      # has to be up first.
      - nginx
    networks:
      - app-network
    # Was missing entirely (defaulted to `no`), so a crash, a Docker daemon
    # restart or a VPS reboot left the renew loop dead and silently stopped all
    # renewals -- this loop is the only scheduler there is.
    restart: unless-stopped
    # `--webroot -w` is pinned explicitly rather than inherited from
    # renewal/arsiva.id.conf. That file currently says `authenticator = webroot`
    # and is correct, but if it is ever rewritten to --standalone the renewal
    # would try to bind port 80 inside this container (which publishes none) and
    # fail every time, silently, until the cert expired.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
# ==========================================
# Konfigurasi Jaringan & Volume
# ==========================================
networks:
  app-network:
    name: arsiva-network
    driver: bridge

volumes:
  pg-data: